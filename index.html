```
<!-- Role Select -->
<select id="roleSelect">
    <option value="software">Software Engineer</option>
    <option value="data">Data Scientist</option>
    <option value="web">Web Developer</option>
</select>

<br><br>

<!-- File Upload -->
<input type="file" id="resume"><br><br>

<button onclick="uploadResume()">Analyze Resume</button>

<div id="loader">⏳ Analyzing...</div>

<h3 id="roleText"></h3>
<div class="score" id="score"></div>

<div class="bar">
    <div class="fill" id="barFill"></div>
</div>

<h4>Matched Skills</h4>
<div class="skills" id="matched"></div>

<h4>Missing Skills</h4>
<div class="skills missing" id="missing"></div>
```

</div>

<script>
async function uploadResume() {

    const fileInput = document.getElementById("resume");
    const role = document.getElementById("roleSelect").value;
    const jobDesc = document.getElementById("jobDesc").value;

    const file = fileInput.files[0];

    if (!file) {
        alert("Please select a file");
        return;
    }

    const formData = new FormData();
    formData.append("resume", file);
    formData.append("role", role);
    formData.append("job_desc", jobDesc);

    document.getElementById("score").innerText = "Analyzing...";
    document.getElementById("loader").style.display = "block";

    try {
        const response = await fetch("https://resume-ai-htmi.onrender.com/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        document.getElementById("loader").style.display = "none";

        document.getElementById("score").innerText = "Score: " + data.score;
        document.getElementById("roleText").innerText = "Role: " + data.role;

        document.getElementById("barFill").style.width = data.score + "%";

        // MATCHED
        document.getElementById("matched").innerHTML =
            data.matched_skills.map(s => `<span>${s}</span>`).join("");

        // MISSING
        document.getElementById("missing").innerHTML =
            data.missing_skills.map(s => `<span>${s}</span>`).join("");

        // 🔥 NEW: BREAKDOWN
        document.getElementById("breakdown").innerHTML =
            `Skill Match: ${data.skill_score}% <br>
             JD Similarity: ${data.similarity_score}%`;

        // 🔥 NEW: SUGGESTIONS
        document.getElementById("suggestions").innerHTML =
            data.suggestions.map(s => `<div>👉 ${s}</div>`).join("");

    } catch (err) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("score").innerText = "Server Error ❌";
    }
}
