<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Resume Analyzer</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass Effect */
.card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    width: 350px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

button {
    background: linear-gradient(90deg,#00c6ff,#0072ff);
    border: none;
    padding: 10px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.progress {
    width: 100%;
    background: #ddd;
    height: 10px;
    border-radius: 10px;
    margin-top: 10px;
}

#barFill {
    height: 10px;
    width: 0%;
    background: green;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="card">

<h2>🚀 AI Resume Analyzer</h2>

<select id="roleSelect">
    <option value="software">Software</option>
    <option value="data">Data</option>
    <option value="web">Web</option>
</select>

<br><br>

<input type="file" id="resume">

<br><br>

<textarea id="jobDesc" placeholder="Paste Job Description"></textarea>

<br><br>

<button onclick="uploadResume()">Analyze Resume</button>

<h3 id="score"></h3>

<div class="progress">
    <div id="barFill"></div>
</div>

<p id="roleText"></p>

<h4>ATS Breakdown</h4>
<p>Skill Match: <span id="skillScore">0%</span></p>
<p>JD Similarity: <span id="similarityScore">0%</span></p>

<h4>Matched Skills</h4>
<ul id="matched"></ul>

<h4>Missing Skills</h4>
<ul id="missing"></ul>

<h4>Suggestions</h4>
<ul id="suggestions"></ul>

<h4>Feedback</h4>
<p id="feedback"></p>

</div>

<script>

// 🔁 Retry function (Render sleep fix)
async function retryFetch(url, options, retries = 2) {
    try {
        return await fetch(url, options);
    } catch (err) {
        if (retries > 0) {
            await new Promise(r => setTimeout(r, 3000));
            return retryFetch(url, options, retries - 1);
        }
        throw err;
    }
}

async function uploadResume() {

    const fileInput = document.getElementById("resume");

    // ✅ SAFE FIX
    const roleElement = document.getElementById("roleSelect");
    const role = roleElement ? roleElement.value : "software";

    const jobDesc = document.getElementById("jobDesc").value;

    const file = fileInput.files[0];

    if (!file) {
        alert("Please select a file");
        return;
    }

    document.getElementById("score").innerText = "⏳ Waking server...";

    const formData = new FormData();
    formData.append("resume", file);
    formData.append("role", role);
    formData.append("job_desc", jobDesc);

    try {

        const response = await retryFetch("https://resume-ai-htmi.onrender.com/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        // ❌ Handle error
        if (!data || !data.score) {
            document.getElementById("score").innerText = "Server Error ❌";
            return;
        }

        // ✅ UI update
        document.getElementById("score").innerText = "Score: " + data.score + "%";
        document.getElementById("roleText").innerText = data.role;

        document.getElementById("barFill").style.width = data.score + "%";

        document.getElementById("matched").innerHTML =
            data.matched_skills.map(s => `<li>${s}</li>`).join("");

        document.getElementById("missing").innerHTML =
            data.missing_skills.map(s => `<li>${s}</li>`).join("");

        document.getElementById("suggestions").innerHTML =
            data.suggestions.map(s => `<li>${s}</li>`).join("");

        document.getElementById("skillScore").innerText =
            (data.skill_score || 0) + "%";

        document.getElementById("similarityScore").innerText =
            (data.similarity_score || 0) + "%";

        // 🔥 Feedback logic
        let feedback = "";
        if (data.score > 80) feedback = "Excellent Resume 🚀";
        else if (data.score > 60) feedback = "Good Resume 👍 Improve some skills";
        else feedback = "Needs Improvement ⚠️ Add missing skills";

        document.getElementById("feedback").innerText = feedback;

    } catch (err) {
        document.getElementById("score").innerText = "Backend not responding ❌";
    }
}

</script>

</body>
</html>
