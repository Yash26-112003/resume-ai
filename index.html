<!DOCTYPE html>
<html>
<head>
<title>AI Resume Analyzer</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 400px;
    text-align: center;
}
button {
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
}
.progress {
    background: #eee;
    height: 10px;
}
.progress-bar {
    background: green;
    height: 10px;
    width: 0%;
}
.loader {
    display: none;
}
</style>

</head>

<body>

<div class="container">
<h2>🚀 AI Resume Analyzer</h2>

<select id="roleSelect">
<option value="software">Software</option>
<option value="data">Data</option>
<option value="web">Web</option>
</select>

<br><br>

<input type="file" id="resume">

<br><br>

<textarea id="jobDesc" placeholder="Paste Job Description"></textarea>

<br><br>

<button onclick="uploadResume()">Analyze Resume</button>

<div id="loader">🔄 Loading...</div>

<h3 id="score"></h3>

<div class="progress">
<div id="barFill" class="progress-bar"></div>
</div>

<p id="roleText"></p>

<h4>Matched</h4>
<div id="matched"></div>

<h4>Missing</h4>
<div id="missing"></div>

<h4>Feedback</h4>
<div id="feedback"></div>

</div>

<script>

async function uploadResume() {

    const file = document.getElementById("resume").files[0];
    const role = document.getElementById("roleSelect").value;
    const jobDesc = document.getElementById("jobDesc").value;

    if (!file) {
        alert("Select file");
        return;
    }

    document.getElementById("loader").style.display = "block";

    const formData = new FormData();
    formData.append("resume", file);
    formData.append("role", role);
    formData.append("job_desc", jobDesc);

    try {
        const res = await fetch("https://resume-ai-htmi.onrender.com/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        document.getElementById("loader").style.display = "none";

        document.getElementById("score").innerText = "Score: " + data.score + "%";
        document.getElementById("roleText").innerText = data.role;

        document.getElementById("barFill").style.width = data.score + "%";

        document.getElementById("matched").innerHTML =
            data.matched_skills.join("<br>");

        document.getElementById("missing").innerHTML =
            data.missing_skills.join("<br>");

        document.getElementById("feedback").innerHTML =
            data.feedback.join("<br>");

    } catch {
        alert("Server error");
    }
}

</script>

</body>
</html>
