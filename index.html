<!DOCTYPE html>
<html>
<head>
<title>AI Resume Analyzer</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container {
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    width:350px;
    text-align:center;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

input,select,textarea,button {
    width:100%;
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    border:none;
}

button {
    background:#00c6ff;
    color:white;
    cursor:pointer;
}

.progress {
    height:10px;
    background:#ccc;
    border-radius:10px;
    overflow:hidden;
}

.bar {
    height:100%;
    width:0%;
    background:lime;
}

</style>
</head>

<body>

<div class="container">

<h2>🚀 AI Resume Analyzer</h2>

<select id="role">
<option value="software">Software</option>
<option value="data">Data</option>
<option value="web">Web</option>
</select>

<input type="file" id="resume">
<textarea id="job_desc" placeholder="Paste Job Description"></textarea>

<button onclick="analyze()">Analyze</button>

<h3 id="status"></h3>

<div class="progress"><div class="bar" id="bar"></div></div>

<p id="score"></p>
<p id="skillScore"></p>
<p id="jdScore"></p>

<h4>Matched</h4>
<div id="matched"></div>

<h4>Missing</h4>
<div id="missing"></div>

<button onclick="downloadPDF()">Download Report</button>

</div>

<script>

const API = "https://resume-ai-htmi.onrender.com";

let lastData = null;

async function analyze() {
    const file = document.getElementById("resume").files[0];
    const role = document.getElementById("role").value;
    const jd = document.getElementById("job_desc").value;

    if(!file){
        alert("Upload file");
        return;
    }

    document.getElementById("status").innerText = "⏳ Analyzing...";

    const formData = new FormData();
    formData.append("resume", file);
    formData.append("role", role);
    formData.append("job_desc", jd);

    try{
        const res = await fetch(API+"/upload",{
            method:"POST",
            body:formData
        });

        const data = await res.json();
        lastData = data;

        document.getElementById("status").innerText = "✅ Done";

        document.getElementById("score").innerText = "Score: "+data.score+"%";
        document.getElementById("skillScore").innerText = "Skill Match: "+data.skill_score+"%";
        document.getElementById("jdScore").innerText = "JD Similarity: "+data.similarity+"%";

        document.getElementById("bar").style.width = data.score+"%";

        document.getElementById("matched").innerText = data.matched.join(", ");
        document.getElementById("missing").innerText = data.missing.join(", ");

    }catch(e){
        document.getElementById("status").innerText = "❌ Error";
    }
}

async function downloadPDF(){
    if(!lastData){
        alert("Analyze first");
        return;
    }

    const res = await fetch(API+"/download",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(lastData)
    });

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "report.pdf";
    a.click();
}

</script>

</body>
</html>
