<h2>Dashboard</h2>

<div id="list"></div>

<script>
const API="https://resume-ai-htmi.onrender.com";
const email=localStorage.getItem("user");

fetch(API+"/get_reports?email="+email)
.then(r=>r.json())
.then(data=>{
    let html="";
    data.forEach(r=>{
        html+=`<p>Score: ${r.score}%</p>`;
    });
    list.innerHTML=html;
});
</script>
